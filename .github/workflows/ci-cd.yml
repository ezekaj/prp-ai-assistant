name: PRP AI Assistant CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # Security and Quality Checks
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety semgrep
          pip install -r requirements.txt
      
      - name: Run Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true
      
      - name: Run Safety vulnerability scan
        run: safety check --json --output safety-report.json || true
      
      - name: Run Semgrep security scan
        run: |
          python -m semgrep --config=auto --json --output=semgrep-report.json . || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

  # Code Quality and Testing
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-benchmark
      
      - name: Set up environment
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/prp_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/1" >> $GITHUB_ENV
          echo "PRP_ENV=testing" >> $GITHUB_ENV
      
      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics
      
      - name: Run black code formatting check
        run: black --check --diff .
      
      - name: Run isort import sorting check
        run: isort --check-only --diff .
      
      - name: Run mypy type checking
        run: mypy . --ignore-missing-imports --no-strict-optional
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --durations=10 \
            -n auto
      
      - name: Run performance benchmarks
        run: |
          pytest tests/test_performance.py -v --benchmark-only --benchmark-json=benchmark.json
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            htmlcov/
            benchmark.json
            coverage.xml

  # 12-Factor Compliance Check
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run 12-Factor compliance check
        run: |
          python .prp/monitoring/run_monitor.py > compliance-report.txt
          cat compliance-report.txt
      
      - name: Check compliance score
        run: |
          SCORE=$(grep "OVERALL COMPLIANCE SCORE" compliance-report.txt | grep -oE '[0-9]+\.[0-9]+')
          echo "Compliance Score: $SCORE%"
          if (( $(echo "$SCORE < 75.0" | bc -l) )); then
            echo "❌ Compliance score $SCORE% is below minimum 75%"
            exit 1
          else
            echo "✅ Compliance score $SCORE% meets requirements"
          fi
      
      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance-report.txt

  # Build and Push Docker Image
  build:
    runs-on: ubuntu-latest
    needs: [security-scan, test, compliance-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.optimized
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/prp-ai-assistant:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/prp-ai-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/prp-ai-assistant:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          
          # Configure kubectl (example for different cloud providers)
          # For AWS EKS:
          # aws eks update-kubeconfig --name ${{ secrets.STAGING_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
          
          # For GKE:
          # gcloud container clusters get-credentials ${{ secrets.STAGING_CLUSTER_NAME }} --zone ${{ secrets.GCP_ZONE }}
          
          # For Azure AKS:
          # az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.STAGING_CLUSTER_NAME }}
          
          # Update image in deployment
          kubectl set image deployment/prp-assistant prp-assistant=${{ secrets.DOCKER_USERNAME }}/prp-ai-assistant:${{ github.sha }} -n staging
          
          # Apply any configuration changes
          kubectl apply -f k8s/staging/ -n staging
          
          # Wait for rollout to complete
          kubectl rollout status deployment/prp-assistant -n staging --timeout=300s
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          
          # Get the staging URL (could be from ingress or service)
          STAGING_URL="${{ secrets.STAGING_URL }}"
          
          # Health check
          echo "Checking health endpoint..."
          curl -f -X GET "$STAGING_URL/health" || exit 1
          
          # Check metrics endpoint
          echo "Checking metrics endpoint..."
          curl -f -X GET "$STAGING_URL/metrics" || exit 1
          
          # Test authentication
          echo "Testing authentication..."
          RESPONSE=$(curl -s -X POST "$STAGING_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"test_user","password":"test_pass"}')
          
          if [[ $RESPONSE == *"error"* ]]; then
            echo "✅ Auth endpoint responding correctly"
          else
            echo "❌ Auth endpoint not working as expected"
            exit 1
          fi

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Deploy to production
        run: |
          echo "🚀 Starting production deployment..."
          
          # Configure kubectl for production cluster
          # Choose based on your cloud provider:
          # aws eks update-kubeconfig --name ${{ secrets.PROD_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
          # gcloud container clusters get-credentials ${{ secrets.PROD_CLUSTER_NAME }} --zone ${{ secrets.GCP_ZONE }}
          # az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.PROD_CLUSTER_NAME }}
          
          # Create backup of current deployment
          kubectl get deployment prp-assistant -n production -o yaml > deployment-backup.yaml
          
          # Update deployment with new image
          kubectl set image deployment/prp-assistant prp-assistant=${{ secrets.DOCKER_USERNAME }}/prp-ai-assistant:${{ github.sha }} -n production
          
          # Apply configuration updates
          kubectl apply -f k8s/production/ -n production
          
          # Wait for rollout with extended timeout
          kubectl rollout status deployment/prp-assistant -n production --timeout=600s
          
          # Verify all pods are running
          kubectl wait --for=condition=ready pod -l app=prp-assistant -n production --timeout=300s
      
      - name: Run production health checks
        run: |
          echo "Running production health checks..."
          
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          
          # Health check with retries
          for i in {1..5}; do
            if curl -f -X GET "$PROD_URL/health"; then
              echo "✅ Health check passed"
              break
            else
              echo "⏳ Health check attempt $i failed, retrying..."
              sleep 10
            fi
          done
          
          # Verify database connectivity
          HEALTH_RESPONSE=$(curl -s "$PROD_URL/health")
          if [[ $HEALTH_RESPONSE == *"\"database\":\"ok\""* ]]; then
            echo "✅ Database connection verified"
          else
            echo "❌ Database connection failed"
            exit 1
          fi
          
          # Check Redis connectivity
          if [[ $HEALTH_RESPONSE == *"\"redis\":\"ok\""* ]]; then
            echo "✅ Redis connection verified"
          else
            echo "⚠️  Redis connection failed (non-critical)"
          fi
      
      - name: Notify deployment success
        run: |
          echo "✅ Production deployment completed successfully"
          # Add notification commands (Slack, email, etc.)

  # Performance Testing
  performance-test:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run performance tests
        run: |
          k6 run --out json=performance-results.json tests/performance/load-test.js
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results.json

  # Generate deployment report
  deployment-report:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY