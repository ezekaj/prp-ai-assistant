app = "zedigital-prp-ai"
primary_region = "ams"

[build]

[env]
  PRP_ENV = "production"
  DB_PATH = "/data/prp.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "prp_data"
  destination = "/data"
